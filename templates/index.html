<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<main class="console">

  <header class="console__header">
    <div class="console__title">
      <span class="dot"></span>
      <h1>CIPHER ORACLE<span class="cursor" aria-hidden="true">_</span></h1>
    </div>
    <p class="console__subtitle">Submit plaintext. Read what comes back. Find the pattern.</p>
  </header>
<!--
  Aww look at our lil hacker! Knows how to view HTML source code! I pulled this challenge out of my ass at the last moment so forgive me if its too ez or too diff.
  Umm to add in a bit of spice this encryption is two ciphers. First is a Vigenère applied to ur input with the key being "cutelilpibble".
  Figure out the second one on your own. Oh yeah and dont forget everything we do is in the printable ASCII range (32 to 126).
-->

  <section class="rig">
    <div class="panel panel--io">
      <div class="panel__label">
        <span class="panel__index">IN</span>
        your plaintext
      </div>
      <textarea id="plaintext" maxlength="500" placeholder="type something..." spellcheck="false"></textarea>
      <button id="runBtn" type="button">
        <span>RUN CIPHER</span>
      </button>
    </div>

    <div class="conduit" id="conduit" aria-hidden="true">
      <svg viewBox="0 0 120 40" preserveAspectRatio="none">
        <path id="conduitPath" d="M0,20 L120,20" />
      </svg>
      <span class="conduit__pulse" id="pulse"></span>
    </div>

    <div class="panel panel--io panel--out">
      <div class="panel__label">
        <span class="panel__index">OUT</span>
        oracle output
      </div>
      <code class="panel__value" id="output">—</code>
    </div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite">&nbsp;</p>

  <footer class="console__footer">
    <span>submissions are not logged for grading — decrypt locally, then submit your flag to the CTF platform</span>
  </footer>

</main>

<script>
const runBtn   = document.getElementById('runBtn');
const input    = document.getElementById('plaintext');
const output   = document.getElementById('output');
const statusEl = document.getElementById('status');
const pulse    = document.getElementById('pulse');

async function runCipher() {
  const text = input.value;
  if (!text) {
    statusEl.textContent = 'enter some plaintext first';
    return;
  }

  runBtn.disabled = true;
  statusEl.textContent = 'querying oracle…';
  pulse.classList.add('conduit__pulse--active');

  try {
    const res = await fetch('/api/encrypt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();

    if (!res.ok) {
      statusEl.textContent = data.error || 'something went wrong';
      output.textContent = '—';
    } else {
      output.textContent = data.result;
      statusEl.textContent = '';
    }
  } catch (e) {
    statusEl.textContent = 'network error — is the server running?';
  } finally {
    runBtn.disabled = false;
    setTimeout(() => pulse.classList.remove('conduit__pulse--active'), 700);
  }
}

runBtn.addEventListener('click', runCipher);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runCipher();
});
</script>

</body>
</html>
